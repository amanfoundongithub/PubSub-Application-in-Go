<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Go Pub/Sub Chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 16px; }
    #log { background: #1e1e1e; color: #f0f0f0; padding: 12px; height: 320px; overflow-y: auto; border-radius: 6px; font-size: 13px; }
    .controls { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
    input, button { padding: 8px; font-size: 14px; }
    #msg { flex: 1; }
    #roomInput { width: 150px; }
    #count { font-size: 13px; color: #555; margin-left: auto; }
  </style>
</head>
<body>
  <h2>Go Real-Time Chat</h2>
  <div class="controls">
    <input id="user" value="aman" placeholder="Username" style="width: 120px;" onchange="joinRoom()" />
    <input id="roomInput" value="general" placeholder="Room name..." onkeydown="if(event.key==='Enter') joinRoom()" />
    <button onclick="joinRoom()">Join</button>
    <span id="count">0 online</span>
  </div>
  <pre id="log"></pre>
  <div class="controls">
    <input id="msg" placeholder="Type a message and hit Enter..." onkeydown="if(event.key==='Enter') sendMsg()" />
    <button onclick="sendMsg()">Send</button>
  </div>

  <script>
    let ws = null;
    const logEl = document.getElementById("log");
    const msgEl = document.getElementById("msg");
    const countEl = document.getElementById("count");
    const roomInputEl = document.getElementById("roomInput");

    function getRoomName() {
      const raw = roomInputEl.value.trim().toLowerCase().replace(/^#/, "");
      const cleaned = raw || "general";
      roomInputEl.value = cleaned;
      return cleaned;
    }

    function joinRoom() {
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      logEl.textContent = "";
      countEl.textContent = "0 online";

      const user = encodeURIComponent(document.getElementById("user").value.trim() || "anonymous");
      const roomName = getRoomName();
      const room = encodeURIComponent(roomName);

      const socket = new WebSocket("ws://" + location.host + "/ws?topic=" + room + "&user=" + user);
      ws = socket;

      socket.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (typeof data.member_count === "number") {
          countEl.textContent = `${data.member_count} online`;
        }
        const time = data.sent_at ? data.sent_at.substring(11, 19) : "";
        if (data.kind === "system") {
          logEl.textContent += `[${time}] * ${data.body} *\n`;
        } else {
          logEl.textContent += `[${time}] ${data.sender}: ${data.body}\n`;
        }
        logEl.scrollTop = logEl.scrollHeight;
      };

      socket.onclose = () => {
        if (ws === socket) {
          countEl.textContent = "0 online";
          logEl.textContent += "--- Disconnected ---\n";
        }
      };
    }

    function sendMsg() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const text = msgEl.value.trim();
      if (!text) return;
      ws.send(JSON.stringify({ body: text }));
      msgEl.value = "";
    }

    joinRoom();
  </script>
</body>
</html>
