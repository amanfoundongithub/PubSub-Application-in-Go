<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Go Pub/Sub Chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 16px; }
    #log { background: #1e1e1e; color: #f0f0f0; padding: 12px; height: 320px; overflow-y: auto; border-radius: 6px; font-size: 13px; }
    .controls { display: flex; gap: 8px; margin-bottom: 12px; }
    input, select, button { padding: 8px; font-size: 14px; }
    #msg { flex: 1; }
  </style>
</head>
<body>
  <h2>Go Real-Time Chat</h2>
  <div class="controls">
    <input id="user" value="aman" placeholder="Username" style="width: 120px;" />
    <select id="room" onchange="joinRoom()">
      <option value="general">#general</option>
      <option value="tech">#tech</option>
      <option value="random">#random</option>
    </select>
  </div>
  <pre id="log"></pre>
  <div class="controls">
    <input id="msg" placeholder="Type a message and hit Enter..." onkeydown="if(event.key==='Enter') sendMsg()" />
    <button onclick="sendMsg()">Send</button>
  </div>

  <script>
    let ws = null;
    const logEl = document.getElementById("log");
    const msgEl = document.getElementById("msg");

    function joinRoom() {
      if (ws) ws.close();
      logEl.textContent = "";

      const user = encodeURIComponent(document.getElementById("user").value.trim() || "anonymous");
      const room = encodeURIComponent(document.getElementById("room").value);

      ws = new WebSocket("ws://" + location.host + "/ws?topic=" + room + "&user=" + user);
      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        const time = data.sent_at ? data.sent_at.substring(11, 19) : "";
        logEl.textContent += `[${time}] ${data.sender}: ${data.body}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      };
      ws.onclose = () => {
        logEl.textContent += "--- Disconnected ---\n";
      };
    }

    function sendMsg() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const text = msgEl.value.trim();
      if (!text) return;
      ws.send(JSON.stringify({ body: text }));
      msgEl.value = "";
    }

    joinRoom();
  </script>
</body>
</html>
