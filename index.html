<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go Pub/Sub Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
      min-height: 100vh;
    }
    .chat-card {
      max-width: 720px;
      margin: 2rem auto;
      border: none;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    .chat-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 1rem 1.25rem;
    }
    #log {
      background-color: #0b1120;
      color: #e2e8f0;
      height: 360px;
      overflow-y: auto;
      border-radius: 10px;
      padding: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .msg-line {
      margin-bottom: 0.35rem;
      word-break: break-word;
    }
    .msg-time {
      color: #64748b;
      margin-right: 0.4rem;
    }
    .msg-sender {
      color: #38bdf8;
      font-weight: 600;
    }
    .msg-system {
      color: #fbbf24;
      font-style: italic;
    }
    .msg-disconnect {
      color: #f87171;
      text-align: center;
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <div class="container px-3">
    <div class="card chat-card">
      <div class="chat-header d-flex justify-content-between align-items-center">
        <div>
          <h4 class="mb-0 fw-semibold">Go Real-Time Chat</h4>
          <small class="text-secondary" id="activeRoomLabel">Room: #general</small>
        </div>
        <span class="badge rounded-pill text-bg-success px-3 py-2" id="count">0 online</span>
      </div>

      <div class="card-body p-3 p-md-4">
        <div class="row g-2 mb-3 align-items-center">
          <div class="col-sm-4">
            <div class="input-group input-group-sm">
              <span class="input-group-text">@</span>
              <input id="user" class="form-control" value="aman" placeholder="Username" onchange="joinRoom()" />
            </div>
          </div>
          <div class="col-sm-5">
            <div class="input-group input-group-sm">
              <span class="input-group-text">#</span>
              <input id="roomInput" class="form-control" value="general" placeholder="Room name..." onkeydown="if(event.key==='Enter') joinRoom()" />
            </div>
          </div>
          <div class="col-sm-3 d-grid">
            <button class="btn btn-primary btn-sm fw-medium" onclick="joinRoom()">Join Room</button>
          </div>
        </div>

        <div id="log" class="mb-3" aria-live="polite"></div>

        <div class="input-group">
          <input id="msg" class="form-control" placeholder="Type a message and press Enter..." onkeydown="if(event.key==='Enter') sendMsg()" />
          <button class="btn btn-dark px-4" onclick="sendMsg()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    const logEl = document.getElementById("log");
    const msgEl = document.getElementById("msg");
    const countEl = document.getElementById("count");
    const roomInputEl = document.getElementById("roomInput");
    const activeRoomLabelEl = document.getElementById("activeRoomLabel");

    function getRoomName() {
      const raw = roomInputEl.value.trim().toLowerCase().replace(/^#/, "");
      const cleaned = raw || "general";
      roomInputEl.value = cleaned;
      return cleaned;
    }

    function appendLine(htmlContent) {
      const div = document.createElement("div");
      div.className = "msg-line";
      div.innerHTML = htmlContent;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function joinRoom() {
      if (ws) {
        ws.onclose = null;
        ws.close();
      }
      logEl.innerHTML = "";
      countEl.textContent = "0 online";

      const user = encodeURIComponent(document.getElementById("user").value.trim() || "anonymous");
      const roomName = getRoomName();
      activeRoomLabelEl.textContent = `Room: #${roomName}`;
      const room = encodeURIComponent(roomName);

      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${protocol}//${location.host}/ws?topic=${room}&user=${user}`);
      ws = socket;

      socket.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (typeof data.member_count === "number") {
          countEl.textContent = `${data.member_count} online`;
        }
        const time = data.sent_at ? data.sent_at.substring(11, 19) : "";
        const safeBody = escapeHtml(data.body || "");
        const safeSender = escapeHtml(data.sender || "unknown");

        if (data.kind === "system") {
          appendLine(`<span class="msg-time">[${escapeHtml(time)}]</span><span class="msg-system">* ${safeBody} *</span>`);
        } else {
          appendLine(`<span class="msg-time">[${escapeHtml(time)}]</span><span class="msg-sender">${safeSender}:</span> ${safeBody}`);
        }
      };

      socket.onclose = () => {
        if (ws === socket) {
          countEl.textContent = "0 online";
          appendLine(`<div class="msg-disconnect">--- Disconnected ---</div>`);
        }
      };
    }

    function sendMsg() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const text = msgEl.value.trim();
      if (!text) return;
      ws.send(JSON.stringify({ body: text }));
      msgEl.value = "";
      msgEl.focus();
    }

    joinRoom();
  </script>
</body>
</html>
